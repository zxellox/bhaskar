<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Navigation</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
}

.topnav {
    background-color: #333;
    overflow: hidden;
}

.topnav a {
    float: rights;
    color: white;
    text-align: center;
    padding: 14px 20px;
    font-size: 17px;
    text-decoration: none;
}

.topnav a:hover {
    background-color: #ddd;
    color: black;
}

.topnav a.active {
    background-color: #04AA6D;
    color: white;
}

.content {
    padding: 20px;
}
</style>
</head>

<body>



<div class="content">
    <h2>Welcome</h2>
    <p>This is a top navigation bar example using HTML and CSS.</p>
</div>

<div class="topnav">
    <a class="active" href="example.html">Home</a>
    <a href="abc.html">News</a>
    <a href="abc.html">Contact</a>
    <a href="abc.html">About</a>
</div>



</body>
</html>
