<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page of facebook</title>
    <link rel="stylesheet" href="/css/facebook.css">
</head>
<body>
    
    <div class="containor">
        <div class="left">
            <div class="logo">f</div>

            <img src="/image/facebook.jpeg" class="bg-pic">

            <h1>
               Explore<br>
               the <br>
               things<br>
               <span>you love</span>.
            </h1>


        </div>
        <div class="right">
            <div class="login-box">
                <h2>Log in to Facebook</h2>

                <form id="loginform">

                    
                    <div class="input-box">
                         <input type="text" id="email" required>
                         <label for="email">Email address or mobile number</label>
                    </div>

                    <div class="input-box">
                         <input type="password" id="password" required>
                         <label for="password">Password</label>
                    </div>

                    <button type="submit">Log in</button>

                    <a href="">Forgotten password?</a>

                    <button type="button" class="create">Create new account</button>

</form>

<div class="meta">

            stroke="#0866FF"

            stroke-linecap="round"
            stroke-linejoin="round"/>
    </svg>
    <span>Meta</span>
            </div> 
        </div> 
    </div>
</div>

</footer>

</html>
